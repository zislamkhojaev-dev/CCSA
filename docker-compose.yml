services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ccsa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ccsa_secret}
      POSTGRES_DB: ${POSTGRES_DB:-ccsa}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ccsa}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-ccsa_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-ccsa_minio_secret}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-ccsa_minio} $${MINIO_ROOT_PASSWORD:-ccsa_minio_secret};
      mc mb local/$${MINIO_BUCKET:-ccsa-audio} --ignore-existing;
      exit 0;
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-ccsa_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-ccsa_minio_secret}
      MINIO_BUCKET: ${MINIO_BUCKET:-ccsa-audio}

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ccsa}:${POSTGRES_PASSWORD:-ccsa_secret}@postgres:5432/${POSTGRES_DB:-ccsa}
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER:-ccsa}:${POSTGRES_PASSWORD:-ccsa_secret}@postgres:5432/${POSTGRES_DB:-ccsa}
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      STT_SERVICE_URL: http://stt-service:8001
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A worker.celery_app worker --loglevel=info --concurrency=${CELERY_WORKER_CONCURRENCY:-1}
    env_file: .env
    environment:
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER:-ccsa}:${POSTGRES_PASSWORD:-ccsa_secret}@postgres:5432/${POSTGRES_DB:-ccsa}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      MINIO_ENDPOINT: minio:9000
      STT_SERVICE_URL: http://stt-service:8001
    volumes:
      - ./backend:/app
    depends_on:
      - api
      - redis
      - postgres
      - stt-service

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A worker.celery_app beat --loglevel=info
    env_file: .env
    environment:
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER:-ccsa}:${POSTGRES_PASSWORD:-ccsa_secret}@postgres:5432/${POSTGRES_DB:-ccsa}
      CELERY_BROKER_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
    depends_on:
      - celery-worker

  stt-service:
    build:
      context: ./backend
      dockerfile: Dockerfile.stt
      args:
        SKIP_CT2_CONVERT: "1"
    env_file: .env
    environment:
      STT_MODEL: ${STT_MODEL:-OvozifyLabs/whisper-small-uz-v1}
      STT_CT2_UZ_MODEL_PATH: /app/models/OvozifyLabs--whisper-small-uz-v1-int8
      STT_AUTO_CONVERT_CT2: "false"
      STT_DEVICE: ${STT_DEVICE:-cpu}
      STT_COMPUTE_TYPE: ${STT_COMPUTE_TYPE:-int8}
      STT_DIARIZATION_METHOD: ${STT_DIARIZATION_METHOD:-stereo_channels}
      STT_LANGUAGE: ${STT_LANGUAGE:-uz}
      HF_TOKEN: ${HF_TOKEN:-}
      HUGGINGFACE_TOKEN: ${HUGGINGFACE_TOKEN:-}
      MINIO_ENDPOINT: minio:9000
    ports:
      - "8001:8001"
    volumes:
      - ./backend/stt:/app/stt
      - ./models/OvozifyLabs--whisper-small-uz-v1-int8:/app/models/OvozifyLabs--whisper-small-uz-v1-int8:ro
      - models_cache:/root/.cache
    depends_on:
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    environment:
      VITE_API_URL: /api/v1
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
  minio_data:
  models_cache:
